name: tests

# A scratch workflow for #414 live rows 1-4: two required jobs named `unit` and `lint`, each trivial.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      slow_and_live:
        description: "run the tests marked slow and live too"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pytest
      - name: pytest
        shell: bash
        run: python3 -m pytest -q --junitxml=junit.xml tests
      - name: upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}-${{ github.run_attempt }}
          path: junit.xml
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: lint
        run: python3 -m compileall -q tests
